name: CST Booking System CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  preflight-secret-scan:
    name: "Preflight: Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  stage-1-unit-tests:
    name: "Stage 1: Unit Tests (${{ matrix.app }})"
    runs-on: ubuntu-latest
    needs: preflight-secret-scan
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: backend
            cache_path: backend/package-lock.json
          - app: frontend
            cache_path: frontend/package-lock.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.cache_path }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Generate Prisma Client
        if: matrix.app == 'backend'
        run: npm run prisma:generate
        working-directory: backend

      - name: Unit tests with coverage threshold
        run: npm run test:unit
        working-directory: ${{ matrix.app }}

  stage-2-integration-tests:
    name: "Stage 2: Integration Tests"
    runs-on: ubuntu-latest
    needs: stage-1-unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cst_booking_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cst_booking_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cst_booking_system?schema=public
      JWT_SECRET: ci-secret-for-cst-booking-system-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LAUNDRY_RESOURCE_COUNT: "4"
      GROUND_RESOURCE_NAME: CST Football Ground
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Prisma destructive migration guard
        run: |
          if grep -REi '\bDROP\s+(TABLE|COLUMN|DATABASE|SCHEMA)\b|\bTRUNCATE\b' prisma/migrations; then
            echo "Potentially destructive Prisma migration detected. Review migration SQL before deploying."
            exit 1
          fi
        working-directory: backend

      - name: Apply database migrations
        run: npm run prisma:deploy
        working-directory: backend

      - name: Backend integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Frontend MSW integration tests
        run: npm run test:integration
        working-directory: frontend

  stage-3-api-contract-tests:
    name: "Stage 3: API Contract Tests"
    runs-on: ubuntu-latest
    needs: stage-2-integration-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cst_booking_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cst_booking_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cst_booking_system?schema=public
      JWT_SECRET: ci-secret-for-cst-booking-system-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LAUNDRY_RESOURCE_COUNT: "4"
      GROUND_RESOURCE_NAME: CST Football Ground
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply database migrations
        run: npm run prisma:deploy
        working-directory: backend

      - name: Run Supertest contract tests
        run: npm run test:contract
        working-directory: backend

  stage-4-e2e-tests:
    name: "Stage 4: End-to-End Tests"
    runs-on: ubuntu-latest
    needs: stage-3-api-contract-tests
    env:
      E2E_BASE_URL: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require staging URL
        run: |
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "Missing STAGING_URL repository secret."
            exit 1
          fi
          if echo "${E2E_BASE_URL}" | grep -q "api"; then
            echo "STAGING_URL must be the deployed frontend URL, not the backend API URL."
            echo "Example: https://cst-booking-frontend-blue.onrender.com"
            exit 1
          fi

      - name: Verify staging frontend is reachable
        run: |
          curl -fsS "${E2E_BASE_URL}" | grep -q "CST Booking System"

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E journeys
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  stage-5-performance-tests:
    name: "Stage 5: Performance Tests"
    runs-on: ubuntu-latest
    needs: stage-4-e2e-tests
    env:
      API_BASE_URL: ${{ secrets.STAGING_API_URL }}
      K6_AUTH_TOKEN: ${{ secrets.K6_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run Lighthouse CI
        run: npm run perf:lighthouse
        working-directory: frontend

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6 uses staged API base URL
        run: grep -q "__ENV.API_BASE_URL" scripts/k6/booking-smoke.js

      - name: Require staging API URL
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "Missing STAGING_API_URL repository secret."
            exit 1
          fi

      - name: Run k6 API smoke load test
        run: k6 run scripts/k6/booking-smoke.js

  stage-6-security-quality-gates:
    name: "Stage 6: Security & Quality Gates"
    runs-on: ubuntu-latest
    needs: stage-5-performance-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Initialize CodeQL SAST
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend type/lint gate
        run: npm run lint
        working-directory: backend

      - name: Frontend type/lint gate
        run: npm run lint
        working-directory: frontend

      - name: Backend production dependency audit
        run: npm run audit:prod
        working-directory: backend

      - name: Frontend production dependency audit
        run: npm run audit:prod
        working-directory: frontend

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Build backend container image
        run: docker build -t cst-booking-backend:ci ./backend

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cst-booking-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build frontend container image
        run: docker build -t cst-booking-frontend:ci ./frontend

      - name: Scan frontend container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cst-booking-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-render:
    name: "Deploy: Render"
    runs-on: ubuntu-latest
    needs: stage-6-security-quality-gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
      RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
      RENDER_FRONTEND_URL: ${{ secrets.RENDER_FRONTEND_URL }}
      RENDER_ROLLBACK_DEPLOY_HOOK: ${{ secrets.RENDER_ROLLBACK_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hooks
        run: |
          set -euo pipefail
          rollback() {
            if [ -n "${RENDER_ROLLBACK_DEPLOY_HOOK:-}" ]; then
              echo "Deployment failed. Triggering configured rollback hook..."
              curl -fsS -X POST "${RENDER_ROLLBACK_DEPLOY_HOOK}" || true
            else
              echo "Deployment failed. No RENDER_ROLLBACK_DEPLOY_HOOK configured; manual rollback may be required."
            fi
          }
          trap rollback ERR

          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ] || [ -z "${RENDER_FRONTEND_DEPLOY_HOOK}" ]; then
            echo "Missing RENDER_BACKEND_DEPLOY_HOOK or RENDER_FRONTEND_DEPLOY_HOOK."
            exit 1
          fi

          if [ -z "${RENDER_API_URL}" ] || [ -z "${RENDER_FRONTEND_URL}" ]; then
            echo "Missing RENDER_API_URL or RENDER_FRONTEND_URL."
            exit 1
          fi

          echo "Deploying backend and frontend on Render..."
          curl -fsS -X POST "${RENDER_BACKEND_DEPLOY_HOOK}"
          curl -fsS -X POST "${RENDER_FRONTEND_DEPLOY_HOOK}"

          echo "Waiting for backend health..."
          backend_ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS "${RENDER_API_URL}/api/health"; then
              backend_ready=true
              break
            fi
            echo "Backend not ready yet, attempt ${attempt}/30"
            sleep 10
          done
          if [ "${backend_ready}" != "true" ]; then
            echo "Backend health check failed after 30 attempts."
            exit 1
          fi

          echo "Checking frontend..."
          curl -fsS "${RENDER_FRONTEND_URL}" >/dev/null

          echo "Render deployment smoke check completed."
          trap - ERR
